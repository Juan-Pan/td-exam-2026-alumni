apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sts-storage
spec:
  serviceName: svc-storage
  replicas: 1
  selector:
    matchLabels:
      app: backend-storage
  template:
    metadata:
      labels:
        app: backend-storage
    spec:
      containers:
        - name: storage
          image: gcr.io/project-f6883221-1297-41bd-9eb/backend-storage:latest
          ports:
            - containerPort: 3000
          volumeMounts:
            - name: storage-volume
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: storage-volume
      spec:
        accessModes: 
          - ReadWriteOnce
        storageClassName: standard
        resources:
          requests:
            storage: 1Gi